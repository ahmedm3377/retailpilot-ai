# Same routes as the Vite dev server's proxy (frontend/vite.config.ts): the API itself stays on loopback.
server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;

    # Agent turns take 5-20 s, the first one after a model load longer.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 2m;   # uploaded case files are limited to 1 MB by the API

    location /api/    { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }
    location /health/ { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }
    location = /docs  { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }
    location = /openapi.json { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }

    location / { try_files $uri /index.html; }
}
